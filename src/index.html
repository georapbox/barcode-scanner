    <h1>Barcode/QR code Scanner</h1>

  <div class="container">
    <a-tab-group no-scroll-controls no-tab-cycling>
      <a-tab role="heading" id="cameraTab">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.625em" height="1.625em" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">

        </svg>
        <span>Use webcam</span>
      </a-tab>

      <a-tab-panel id="cameraPanel">
        <camera-scanner></camera-scanner>
        <div class="camera-scanner-instructions">Align barcode in the center of the frame.</div>
        <div class="results"></div>
      </a-tab-panel>

  <modal-element id="historyDialog" class="popover-dialog history-dialog" placement="top-end" hidden>
    <span slot="header">History</span>
    <scan-history></scan-history>
  </modal-element>

  <modal-element id="settingsDialog" class="popover-dialog settings-dialog" placement="top-end" hidden>
    <span slot="header">Settings</span>

    <scan-settings>
      <form id="settingsForm" autocomplete="off">
        <fieldset>
          <legend>When barcode is detected...</legend>
          <ul>
            <li><label><input type="checkbox" name="general-settings" value="openWebPage">Open web pages automatically</label></li>
            <li><label><input type="checkbox" name="general-settings" value="openWebPageSameTab">Open web pages in the same tab</label></li>
            <li><label><input type="checkbox" name="general-settings" value="addToHistory">Add to history</label></li>
          </ul>
        </fieldset>

        <fieldset>
          <legend>Effects</legend>
          <ul>
            <li><label><input type="checkbox" name="general-settings" value="beep">Beep</label></li>
            <li><label><input type="checkbox" name="general-settings" value="vibrate">Vibrate (Android)</label></li>
          </ul>
        </fieldset>

        <fieldset name="bs-formats">
          <legend>
            Supported formats
            <br>
            <small class="text-muted fw-normal">If none is checked, all formats will be supported.</small>
          </legend>
          <ul id="formatsList" class="formats-list"></ul>
        </fieldset>
      </form>
    </scan-settings>
  </modal-element>

  <script src="./js/register-service-worker.js" type="module"></script>
  <script src="./js/index.js" type="module"></script>
</body>
</html>
